name: snagbox

services:
  snagbox:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/downloader
      REDIS_URL: redis://redis:6379
      # Local opt-out. Unset before this port is reachable beyond your machine.
      AUTH_DISABLED: "true"
      NODE_ENV: production
      # Production boot refuses an empty signing secret. Compose reads .env.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env before docker compose up (openssl rand -base64 32). See .env.example.}
      # Uncomment with the bgutil profile:
      # YTDLP_POT_BASE_URL: http://bgutil:4416
      # Uncomment with the minio profile (create the bucket in the console first):
      # STORAGE_DRIVER: r2
      # R2_ENDPOINT: http://minio:9000
      # R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      # R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # R2_BUCKET: downloads
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: downloader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d downloader"]
      interval: 5s
      timeout: 5s
      retries: 20

  bgutil:
    profiles: ["bgutil"]
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
